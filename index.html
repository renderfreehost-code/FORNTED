<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151627" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ACI STORE" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>ACI STORE</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (location.pathname.startsWith("/admin") && "serviceWorker" in navigator && !sessionStorage.getItem("admin_sw_refresh")) {
        sessionStorage.setItem("admin_sw_refresh", "1");
        Promise.all([
          navigator.serviceWorker.getRegistrations().then((items) => Promise.all(items.map((item) => item.update().catch(() => {})))),
          "caches" in window ? caches.keys().then((keys) => Promise.all(keys.filter((key) => key.startsWith("aci-store-pwa")).map((key) => caches.delete(key)))) : Promise.resolve()
        ]).finally(() => location.reload());
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
